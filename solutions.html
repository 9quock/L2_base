  function hasTwoCubeSums(n) {
    let max = Math.ceil(Math.cbrt(n))
    let numbers = []
    
    for (let i = 1; i < max; i += 1) {
      if (numbers.includes(i)) continue
      let other_term = Math.cbrt(n - i*i*i)
      if (other_term%1 == 0) numbers.push(i, other_term)
    }

    return numbers.length >= 4
  }

  console.log(hasTwoCubeSums(87539319))

  function ipv4Parser(_ip, _mask) {
    let [ip, mask] = [_ip, _mask].map(s => s.split(".").map(v => Number(v)))

    let nblock = [], hid = []
    for (let i = 0; i < 4; i += 1) {
      nblock[i] = ip[i] & mask[i]
      hid[i] = ip[i] & ~mask[i]
    }

    return [nblock.join("."), hid.join(".")]
  }
  
  console.log(ipv4Parser('192.168.50.1', '255.255.255.0'))

  function whatCentury(year) {
    let number = Math.ceil(Number(year) / 100)

    let postfix = "th"
    if (number > 20) {
      switch (number % 10) {
        case 1: postfix = "st"; break
        case 2: postfix = "nd"; break
        case 3: postfix = "rd"; break
      }
    }

    return number + postfix
  }

  console.log(whatCentury(2230))

  function findMissing(list) {
    let expected_diff = list[1] - list[0]
    if (list[2] - list[1] < expected_diff) {
      return list[1] - (list[2] - list[1])
    }

    for (let i = 2; i < list.length; i += 1) {
      if (list[i] - list[i-1] != expected_diff) {
        return list[i-1] + expected_diff
      }
    }
  }

  console.log(findMissing([-11, -9, -5, -3]))

  function primeFactors(n){
    let factors = [], divisor = 2
    while (n != 1) {
      let quotient = n / divisor
      if (quotient % 1 != 0) {
        divisor += 1
        continue
      }
      n = quotient
      factors.push(divisor)
    }
    factors.push(0)
  
    let output = ""
    let count = 1, current = factors[0]
    for (let i = 1; i < factors.length; i += 1) {
      if (factors[i] != current) {
        output += "(" + current + (count == 1 ? "" : ("**" + count)) + ")"
        current = factors[i], count = 0
      }
      count += 1
    }

    return output
  }

  console.log(primeFactors(7775460))

  function toWeirdCase(string) {

  function wave(str){
    output = []
    str.split("").forEach((c, i) => {
      if (c == " ") return
      output.push(str.slice(0, i) + c.toUpperCase() + str.slice(i+1))
    })
    return output
  }

  function expandedForm(_num) {
    let output = [], num = String(_num)
    num.split("").forEach((v, i) => {
      if (v == "0") return
      let zeros = num.length - i
      output.push(v + "0".repeat(zeros-1))
    })
    return output.join(" + ")
  }

  function solution(str){
    if (str.length%2 != 0) str += "_"
    output = []
    str.split("").forEach((v, i) => {
      if (i%2 != 0) return
      output.push(str[i] + str[i+1])
    })
    return output
  }

  console.log(solution("abc"))

  function bingo(ticket, win){
    let won = ticket.reduce((a, v) => a += v[0].indexOf(String.fromCharCode(v[1])) != -1, 0) >= win
    return won ? "Winner!" : "Loser!"
  }

  function domainName(url){
    const regex = new RegExp('^(?:https?:\\\/\\\/)?(?:[^@\\\/\\n]+@)?(?:www\\.)?([^:\\\/\\n\\.]+)', 'igm')
    return regex.exec(url)[1]
  }

  function longest(arr, n) {
    return arr.sort((a, b) => b.length - a.length || arr.indexOf(a) - arr.indexOf(b))[n-1]
  }

  }

  function isCircleSorted( arr ){
    let split = -1
    for (let i = 1; i < arr.length; i += 1) {
      if (arr[i-1] > arr[i]) {
        if (split != -1) return false
        split = i-1
      }
    }
    if (split == -1) return true

    return arr.at(-1) <= arr.at(0)
  }

  //////[ 15 ]//////
  function howManyTimes(_time1,_time2){
    let time1 = new Date(_time1), time2 = new Date(_time2)
    let hits = 0

    while (time1 < time2) {
      let diff = time2 - time1
      let ss = Math.floor(diff / 1000)
      let mm = diff / 1000 / 60

      let hit_count = time1.getHours()%12
      if (hit_count == 0) hit_count = 12
      
      if (time1.getMinutes() == 0) hits += Math.min(Math.max(0, hit_count - time1.getSeconds()), ss)
      if (time1.getMinutes() <= 30 && mm > 30) hits += 1

      time1.setHours(time1.getHours() + 1)
      time1.setMinutes(0)
      time1.setSeconds(0)
    }
    
    return hits
  }

  console.log(howManyTimes("2044-03-28 22:13:05","2044-03-29 08:55:31"))

  //////[ 16 ]//////
  Array.prototype.square = function() {
    return [...this].map(x => x*x)
  }
  Array.prototype.cube = function() {
    return [...this].map(x => x*x*x)
  }
  Array.prototype.average = function() {
    if (this.length == 0) return NaN
    return this.reduce((a, x) => a += x, 0) / this.length
  }
  Array.prototype.sum = function() {
    return this.reduce((a, x) => a += x, 0)
  }
  Array.prototype.even = function() {
    return [...this].filter(x => x%2==0)
  }
  Array.prototype.odd = function() {
    return [...this].filter(x => x%2==1)
  }
  
  const numbers = [1, 2, 3, 4, 5]
  console.log(numbers.square(), numbers.cube(), numbers.average(), numbers.sum(), numbers.even(), numbers.odd())

  function cache(func) {
    const chached_values = new Map()
    return function() {
      let str = JSON.stringify(arguments)
      if (chached_values.has(str)) return chached_values.get(str)

      let chached_value = func.apply(this, arguments)
      chached_values.set(str, chached_value)
      return chached_value
    }
  }

  let counter = 0
  function complex() { counter += 1 }
  let wrapped = cache(complex)

  wrapped()
  wrapped()
  wrapped()

  console.log(counter == 1)
